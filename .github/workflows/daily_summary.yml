name: Daily Telegram News Summary

on:
#  schedule:
    # Runs daily at 08:00 UTC (adjust as desired)
    #- cron: '30 8 * * *'
  workflow_dispatch:
    # Allows manual triggering from GitHub UI
    inputs:
      debug:
        description: 'Enable verbose debug logging'
        required: false
        type: boolean
        default: true
      enable_audio:
        description: 'Enable audio narration generation'
        required: false
        type: boolean
        default: true

jobs:
  gather-and-summarize:
    name: Gather & Summarize
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram Summarizer Pipeline
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_CHAT: ${{ secrets.TARGET_CHAT }}
          DEBUG: ${{ (github.event.inputs.debug == 'true' || github.event.inputs.debug == true) && '1' || vars.DEBUG || secrets.DEBUG || '' }}
        run: |
          python main.py --no-audio

      - name: Upload summary cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: summary-cache
          path: cache/
          retention-days: 1

  generate-speech:
    name: Generate Speech
    needs: gather-and-summarize
    if: ${{ !failure() && !cancelled() && (github.event.inputs.enable_audio == 'true' || github.event.inputs.enable_audio == true || (github.event.inputs.enable_audio == null && vars.ENABLE_AUDIO != '0')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download summary cache artifact
        uses: actions/download-artifact@v4
        with:
          name: summary-cache
          path: cache/

      - name: Generate and Publish Audio Digest
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_CHAT: ${{ secrets.TARGET_CHAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          DEBUG: ${{ (github.event.inputs.debug == 'true' || github.event.inputs.debug == true) && '1' || vars.DEBUG || secrets.DEBUG || '' }}
        run: |
          python main.py --use-cached-response --audio-only
