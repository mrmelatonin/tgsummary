# Telegram Channel Aggregator Configuration

# List of public Telegram channels to monitor (username or full t.me link)
channels:
  - "t.me/nvua_official"
  - "t.me/svoboda_radio"
  - "t.me/ukrpradva_news"
  - "t.me/babel"
  - "t.me/bbcukrainian"
  - "t.me/V_Zelenskiy_official"
  - "t.me/liganet" 
  - "t.me/suspilnenews" 
# Time window for fetching posts (in hours)
lookback_hours: 24

# Maximum number of posts to fetch per channel to keep token usage within limits
max_posts_per_channel: 25

# Target Telegram channel/chat where the summary will be posted
# Can be a channel username (e.g., "@my_summary_channel") or integer chat ID
target_chat: "@my_summary_channel"

# Optional Speech narration (supports local neural ua-tts, Google Gemini TTS, or Microsoft Azure Speech)
speech:
  enabled: true
  provider: "gemini"    # "ua-tts" (local Ukrainian neural TTS), "gemini" (Gemini 3.8 Flash TTS), or "azure" (Azure REST API)
  voice: "Kore"       # ua-tts voices: dmytro, tetiana, mykyta, lada, oleksa, olena, olga
                        # gemini voices: Kore, Puck, Charon, Fenrir, Aoede
                        # azure voices: uk-UA-OstapNeural, uk-UA-PolinaNeural
  speed: 1.0            # Playback speed (0.5 to 2.0, for ua-tts)
  device: "cpu"         # Compute device: "cpu" or "cuda" (for ua-tts)
  backend: "auto"       # TTS backend: "auto", "ukrainian_tts", "silero", "synth" (for ua-tts)
  stress: "dictionary"  # Stress placement method: "dictionary" or "model" (for ua-tts)
  model_path: "models/ua_tts" # Path to local weights folder (for ua-tts)
  # Gemini TTS settings (optional):
  # model: "gemini-3.8-flash-tts" # or "gemini-3.8-flash-lite-tts"
  # style: "natural and professional news anchor"

# Gemini AI Summarizer settings
summarizer:
  # Gemini model to use
  #model_name: "gemini-flash-latest"
  model_name: "gemini-3.1-flash-lite"
  # Language of the final summary digest (e.g., "English", "Spanish", "Russian")
  language: "Ukrainian"
  # Custom prompt instructions for topic synthesis
  custom_instruction: >
    Synthesize all channel posts into a clean, minimal news digest.
    Group by major key topics.
    Use an emoji icon and bold title for each topic header (e.g. 📌 **Тема**).
    Provide simple non-bold bullet points (- text) without sources, links, or excessive formatting.
